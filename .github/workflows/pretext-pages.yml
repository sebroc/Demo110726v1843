name: Publish lecture notes

on:
  push:
    paths:
      - 'Notes/Chap*/**'
      - 'Notes/pretext/**'
      - '.github/workflows/pretext-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pretext-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: pandoc/actions/setup@v1
        with:
          version: '3.6.3'
      - run: python -m pip install -r Notes/pretext/requirements.txt
      - name: Convert TeX and build HTML
        working-directory: Notes/pretext
        run: |
          python build.py
          pretext build web --no-generate
          test -s output/web/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: Notes/pretext/output/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
